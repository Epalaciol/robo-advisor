name: Taller 2 · Pipeline TES (curva Nelson-Siegel)

# Descarga de www.irc.gov.co los Informes Diarios de TES que falten (últimos ~15 días hábiles),
# valida, calibra la curva y carga las tablas t2_* en Supabase. IRC publica con días de retraso,
# por eso se revisa una ventana y no solo "ayer". Idempotente.
# Requiere los secretos SUPABASE_URL, SUPABASE_ANON_KEY y SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: "17 13 * * 1-5"  # ~8:17 am Bogotá
    - cron: "41 23 * * 1-5"  # ~6:41 pm Bogotá (fuera del minuto 0)
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = últimos ~15 días hábiles"
        required: false

jobs:
  update-tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -e .
      - name: Actualizar TES
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.desde }}" ]; then
            python -m roboadvisor.taller2.pipeline.update_tes --desde "${{ github.event.inputs.desde }}"
          else
            python -m roboadvisor.taller2.pipeline.update_tes --diario
          fi
