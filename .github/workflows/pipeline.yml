name: Pipeline de precios

on:
  # Requiere los secretos del repo: SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY.
  schedule:
    # GitHub puede retrasar o descartar corridas programadas al inicio de cada hora (alta carga),
    # así que se evita el minuto 0. La segunda es un respaldo: el pipeline es idempotente (upsert).
    - cron: "23 22 * * 1-5"  # ~5:23 pm Bogotá, lunes a viernes
    - cron: "47 23 * * 1-5"  # respaldo, ~6:47 pm Bogotá
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -e .
      - name: Actualizar precios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m roboadvisor.pipeline.update_prices
