[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboadvisor"
version = "0.0.1"
description = "Proto robo-advisor académico (Taller 1, Inversiones EAFIT)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "plotly",
    "streamlit",
    "supabase",
    "yfinance",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pglast",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requiere un proyecto Supabase real (SUPABASE_SERVICE_ROLE_KEY en .env); se omite si no está",
]
# Avisos de deprecación de librerías de terceros (supabase); no son de este código.
filterwarnings = [
    "ignore:The 'timeout' parameter is deprecated:DeprecationWarning",
    "ignore:The 'verify' parameter is deprecated:DeprecationWarning",
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
